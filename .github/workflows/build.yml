name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webapp:
    name: Build webapp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
